name: Deploy to Cloudflare

# Manual trigger for now: this repo is mid-migration off ChatGPT Sites onto a
# real Cloudflare account (see wrangler.toml). Switch to `on: push: branches:
# [main]` once CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets exist and
# a first manual run has succeeded.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm run install:ci

      - name: Build
        run: npm run build

      - name: Push Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_ALLOWED_EMAILS: ${{ secrets.AI_ALLOWED_EMAILS }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REDIRECT_URI: ${{ secrets.LINKEDIN_REDIRECT_URI }}
          LINKEDIN_SESSION_SECRET: ${{ secrets.LINKEDIN_SESSION_SECRET }}
          RADAR_CRON_SECRET: ${{ secrets.RADAR_CRON_SECRET }}
        run: |
          set -euo pipefail
          for name in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY AI_ALLOWED_EMAILS \
                      LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET LINKEDIN_REDIRECT_URI \
                      LINKEDIN_SESSION_SECRET RADAR_CRON_SECRET; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "Setting secret: $name"
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping unset secret: $name"
            fi
          done

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
