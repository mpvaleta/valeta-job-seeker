name: Automation bridge

# The hands of the scheduled Claude session (which runs on the owner's
# subscription in a network-restricted sandbox and cannot reach the app
# directly). Each mode is one narrow, authenticated action against the
# deployed Worker, using the same APP_TOKEN secret the deploy workflow
# already stores. No secret ever appears in inputs, logs, results, or
# artifacts.
#
# Two ways in, same actions:
#   - workflow_dispatch (manual runs, or sessions that have GitHub API
#     tools): mode=scan publishes a job-listings artifact; mode=deliver
#     posts a base64 draft payload.
#   - push to automation/request/** (the scheduled session's path — it only
#     has git): the pushed branch carries request/scan.json or
#     request/draft.json; the workflow commits results/ back onto the same
#     branch, which the session polls with git fetch. The result commit is
#     tagged [bridge-result] so it does not re-trigger this workflow.
#
# scan results contain public job listings and fit scores only — never the
# profile, documents, or drafts.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What the bridge should do"
        required: true
        type: choice
        options:
          - scan
          - deliver
      draft_b64:
        description: "deliver mode only: base64-encoded JSON body for POST /api/drafts"
        required: false
        type: string
  push:
    branches:
      - "automation/request/**"

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[bridge-result]')
    steps:
      - uses: actions/checkout@v4

      - name: Determine request
        id: request
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -f request/draft.json ]; then echo "mode=deliver" >> "$GITHUB_OUTPUT";
            elif [ -f request/scan.json ]; then echo "mode=scan" >> "$GITHUB_OUTPUT";
            else echo "mode=none" >> "$GITHUB_OUTPUT"; echo "No request file on this branch."; fi
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run radar scan
        if: steps.request.outputs.mode == 'scan'
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          set -euo pipefail
          scan=$(curl -sS --max-time 240 -X POST "https://valeta-job-seeker.marcos-valeta.workers.dev/api/radar" \
            -H "Authorization: Bearer $APP_TOKEN" -H "Content-Type: application/json" \
            -d '{"action":"scan","trigger":"manual"}')
          ok=$(echo "$scan" | jq -r '.ok')
          if [ "$ok" != "true" ]; then
            # A recent scan already covered this window; the dashboard fetch
            # below still returns current data, so only a hard failure stops us.
            code=$(echo "$scan" | jq -r '.code // "unknown"')
            if [ "$code" != "scan_rate_limited" ]; then
              echo "Scan failed: $code"; echo "$scan" | jq -c '{ok, code, message}'; exit 1
            fi
            echo "Scan skipped: rate limited (a recent scan already ran)."
          else
            echo "$scan" | jq -c '.result | {checked, discovered, found, added, matchedAdded, failures: (.failures | length)}'
          fi
          mkdir -p results
          # Drafting preferences only — tone and model choice, never the
          # profile, documents, facts, or drafts.
          drafting=$(curl -sS --max-time 60 "https://valeta-job-seeker.marcos-valeta.workers.dev/api/workspace" \
            -H "Authorization: Bearer $APP_TOKEN" \
            | jq -c '{tone: (.snapshot.writingStyle.tone // ""), prefer: (.snapshot.writingStyle.prefer // ""), avoid: (.snapshot.writingStyle.avoid // ""), claudeModel: (.snapshot.claudeModel // "sonnet")}')
          curl -sS --max-time 60 "https://valeta-job-seeker.marcos-valeta.workers.dev/api/radar" \
            -H "Authorization: Bearer $APP_TOKEN" \
            | jq --argjson drafting "$drafting" '{
                fetchedAt: (now | todate),
                lastRunAt,
                dueCount,
                drafting: $drafting,
                monitors: [(.monitors // [])[] | {company, active, lastRunStatus, lastRunFoundCount, lastCheckedAt, lastRunSummary}],
                opportunities: [(.opportunities // [])[] | {id, title, company, location, sourceUrl, sourceType, fitScore, fitSummary, status, alignmentPasses, origin}]
              }' > results/radar-inbox.json
          jq -r '"\(.opportunities | length) opportunities in inbox"' results/radar-inbox.json

      - uses: actions/upload-artifact@v4
        if: steps.request.outputs.mode == 'scan' && github.event_name == 'workflow_dispatch'
        with:
          name: radar-inbox
          path: results/radar-inbox.json
          retention-days: 1

      - name: Deliver draft
        if: steps.request.outputs.mode == 'deliver'
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          DRAFT_B64: ${{ inputs.draft_b64 }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            cp request/draft.json draft.json
          else
            if [ -z "$DRAFT_B64" ]; then echo "deliver mode requires draft_b64"; exit 1; fi
            echo "$DRAFT_B64" | base64 -d > draft.json
          fi
          jq -e '.type and .content' draft.json > /dev/null || { echo "The draft payload is not valid draft JSON"; exit 1; }
          mkdir -p results
          response=$(curl -sS --max-time 60 -X POST "https://valeta-job-seeker.marcos-valeta.workers.dev/api/drafts" \
            -H "Authorization: Bearer $APP_TOKEN" -H "Content-Type: application/json" \
            --data-binary @draft.json)
          echo "$response" | jq -c '{ok, changed, draftId, versionNumber, code, message}' | tee results/delivery-result.json
          [ "$(echo "$response" | jq -r '.ok')" = "true" ]

      - name: Commit results back to the request branch
        if: github.event_name == 'push' && steps.request.outputs.mode != 'none'
        run: |
          set -euo pipefail
          git config user.name "automation-bridge"
          git config user.email "noreply@users.noreply.github.com"
          git add results
          git commit -m "[bridge-result] ${{ steps.request.outputs.mode }} results"
          git push origin HEAD
