name: Bootstrap Cloudflare D1 schema

# One-time (or one-time-per-migration-file) manual trigger. Applies the
# drizzle/*.sql migrations directly against the real D1 database with
# `wrangler d1 execute --remote`. Re-running after the schema already exists
# will fail loudly on "table already exists" rather than silently duplicate
# anything, so it is safe to re-trigger by mistake.
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install wrangler
        run: npm install --no-save wrangler@4.92.0

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for file in drizzle/*.sql; do
            echo "Applying $file"
            npx wrangler d1 execute valeta-job-seeker-db --remote --file="$file"
          done
